# Docker Swarm deployment configuration — external database (no containerized PostgreSQL)
#
# Usage:
#   make start-swarm-nodb ENV_FILE=.env.DEV_SWARM
#
# Same as docker-compose.swarm.yml but without the db service.
# Set POSTGRES_HOST, POSTGRES_PORT, etc. in your env file to point to the external DB.

services:

    frontend:
        image: ${REGISTRY}/validationsvc-frontend
        ports:
            - 80:80
            - 443:443
        environment:
            CERTBOT_DOMAIN: ${CERTBOT_DOMAIN}
            CERTBOT_EMAIL: ${CERTBOT_EMAIL}
        volumes:
            - letsencrypt_data:/etc/letsencrypt
            - static_data:/app/backend/django_static
        networks:
            - validate
        deploy:
            replicas: 1
            resources:
                limits:
                    memory: 256M
            placement:
                constraints: [node.role == manager]
            restart_policy:
                condition: on-failure
                delay: 5s

    backend:
        image: ${REGISTRY}/validationsvc-backend
        entrypoint: /app/backend/server-entrypoint.sh
        env_file: ${ENV_FILE}
        volumes:
            - static_data:/app/backend/django_static
            - files_data:/files_storage
            - gherkin_rules_log_data:/gherkin_logs
        expose:
            - 8000
        networks:
            - validate
        deploy:
            replicas: 1
            resources:
                limits:
                    memory: ${BACKEND_MEMORY_LIMIT}
            placement:
                constraints: [node.role == manager]
            restart_policy:
                condition: on-failure
                delay: 5s
            update_config:
                parallelism: 1
                delay: 30s
                failure_action: rollback
        healthcheck:
            test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/')\""]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 300s

    worker:
        image: ${REGISTRY}/validationsvc-backend
        entrypoint: /app/backend/worker-entrypoint.sh
        env_file: ${ENV_FILE}
        volumes:
            - files_data:/files_storage
            - gherkin_rules_log_data:/gherkin_logs
        networks:
            - validate
        deploy:
            replicas: ${WORKER_REPLICAS}
            # No placement constraint - workers run on any node
            resources:
                limits:
                    memory: ${WORKER_MEMORY_LIMIT}
                reservations:
                    memory: ${WORKER_MEMORY_RESERVATION}
            restart_policy:
                condition: on-failure
                delay: 5s
            update_config:
                parallelism: 1
                delay: 30s
                failure_action: rollback

    av_worker:
        image: ${REGISTRY}/validationsvc-backend
        entrypoint: /app/backend/worker-clamav-entrypoint.sh
        env_file: ${ENV_FILE}
        volumes:
            - files_data:/files_storage
            - clamav_data:/var/lib/clamav # persist databa
        networks:
            - validate
        deploy:
            replicas: 1
            resources:
                limits:
                    memory: ${AV_WORKER_MEMORY_LIMIT}
            # No placement constraint - workers run on any node
            restart_policy:
                condition: on-failure
                delay: 5s
            update_config:
                parallelism: 1
                delay: 30s
                failure_action: rollback

    scheduler:
        image: ${REGISTRY}/validationsvc-backend
        entrypoint: /app/backend/worker-beat-entrypoint.sh
        env_file: ${ENV_FILE}
        volumes:
            - files_data:/files_storage
            - gherkin_rules_log_data:/gherkin_logs
        networks:
            - validate
        deploy:
            replicas: 1
            resources:
                limits:
                    memory: ${SCHEDULER_MEMORY_LIMIT}
            placement:
                constraints: [node.role == manager]
            restart_policy:
                condition: on-failure
                delay: 5s

    redis:
        image: redis:8.4-alpine
        command: redis-server --protected-mode no --bind 0.0.0.0
        expose:
            - 6379
        volumes:
            - redis_data:/data
        networks:
            - validate
        deploy:
            replicas: 1
            resources:
                limits:
                    memory: 512M
            placement:
                constraints: [node.role == manager]
            restart_policy:
                condition: on-failure
                delay: 5s

    # ---------------------------------------------------------------------------
    # Observability (additive services; removing them restores the previous stack).
    # Config files are bind-mounted from the checkout via ${PWD}, which envsubst
    # fills in at deploy time. That is why these services are pinned to the manager
    # node: that is where the checkout lives.
    # ---------------------------------------------------------------------------

    otel_col:
        image: otel/opentelemetry-collector-contrib:0.156.0
        command: ["--config=/etc/otel-collector-config.yaml"]
        expose:
            - 4317  # OTLP over gRPC receiver
            - 4318  # OTLP over HTTP receiver
            - 8888  # collector self-metrics (Prometheus scrape)
            - 8889  # prometheus exporter: OTLP-received app metrics
            - 13133 # health_check extension
        volumes:
            - ${PWD}/docker/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
        networks:
            - validate
        deploy:
            replicas: 1
            resources:
                limits:
                    memory: 512M
            placement:
                constraints: [node.role == manager]
            restart_policy:
                condition: on-failure
                delay: 5s

    prometheus:
        image: prom/prometheus:v3.13.1
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            # Keep one year of history instead of the 15-day default. Quarterly trends
            # (file sizes, memory usage) are exactly what we need and 15 days erases
            # them. The time-series database was only 162 MB at 15 days, so a year is
            # cheap in storage terms.
            - '--storage.tsdb.retention.time=1y'
        expose:
            - 9090
        volumes:
            - ${PWD}/docker/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        networks:
            - validate
        deploy:
            replicas: 1
            resources:
                limits:
                    memory: 1G
            placement:
                constraints: [node.role == manager]
            restart_policy:
                condition: on-failure
                delay: 5s

    grafana:
        image: grafana/grafana:12.3.9
        # env_file gives Grafana POSTGRES_HOST/PORT/USER/NAME/PASSWORD for the
        # provisioned datasource (provisioning/datasources/postgres.yaml).
        # Same pattern as backend and worker. It also avoids envsubst problems:
        # variables not listed in the Makefile's SWARM_VARS would be substituted
        # with an empty string.
        # NOTE: set GF_SECURITY_ADMIN_PASSWORD in the environment file, otherwise
        # Grafana starts with the default admin/admin credentials.
        env_file: ${ENV_FILE}
        ports:
            - 3000:3000
        volumes:
            - ${PWD}/docker/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
            - ${PWD}/docker/grafana/provisioning:/etc/grafana/provisioning:ro
            # dashboards as code, loaded via provisioning/dashboards/vs-dashboards.yaml
            - ${PWD}/docker/grafana/dashboards:/etc/grafana/dashboards-vs:ro
            - grafana_data:/var/lib/grafana
        networks:
            - validate
        deploy:
            replicas: 1
            resources:
                limits:
                    memory: 512M
            placement:
                constraints: [node.role == manager]
            restart_policy:
                condition: on-failure
                delay: 5s

    node_exporter:
        image: prom/node-exporter:v1.12.1
        command:
            - '--path.rootfs=/host'
        volumes:
            - /:/host:ro,rslave
        networks:
            - validate
        deploy:
            mode: global  # one per node; Prometheus discovers via tasks.node_exporter
            resources:
                limits:
                    memory: 128M
            restart_policy:
                condition: on-failure
                delay: 5s

    celery_exporter:
        image: danihodovic/celery-exporter:0.12.2
        environment:
            CE_BROKER_URL: redis://redis:6379/0
        expose:
            - 9808
        networks:
            - validate
        deploy:
            replicas: 1
            resources:
                limits:
                    memory: 512M
            restart_policy:
                condition: on-failure
                delay: 5s

networks:
    validate:
        driver: overlay
        driver_opts:
            com.docker.network.driver.mtu: "1400"

volumes:
    static_data:
    letsencrypt_data:
    redis_data:
    files_data:
        driver: local
        driver_opts:
            type: nfs
            o: "addr=${NFS_SERVER_IP},nfsvers=4.1,rw,hard,timeo=600,retrans=2"
            device: ":${NFS_BASE_PATH}/files_data"
    gherkin_rules_log_data:
        driver: local
        driver_opts:
            type: nfs
            o: "addr=${NFS_SERVER_IP},nfsvers=4.1,rw,hard,timeo=600,retrans=2"
            device: ":${NFS_BASE_PATH}/gherkin_logs"
    clamav_data:
    prometheus_data:
    grafana_data: