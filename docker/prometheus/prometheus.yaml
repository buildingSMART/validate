global:
  scrape_interval: 15s

scrape_configs:
  # The OpenTelemetry collector exposes two endpoints: its own health/telemetry on
  # :8888, and any application metrics it received over OTLP on :8889.
  - job_name: "otel-collector"
    scrape_interval: 10s
    static_configs:
      - targets: ["otel_col:8888", "otel_col:8889"]

  # node_exporter runs in swarm global mode (one task per node). tasks.<service> is
  # the swarm DNS name that resolves to every task, so dns_sd finds all nodes
  # automatically, including nodes added later.
  - job_name: "node"
    dns_sd_configs:
      - names: ["tasks.node_exporter"]
        type: A
        port: 9100

  - job_name: "celery"
    static_configs:
      - targets: ["celery_exporter:9808"]

  # Django HTTP metrics (django-prometheus): requests, latencies and status codes
  # per view - including 429s, which never reach the database.
  - job_name: "django"
    static_configs:
      - targets: ["backend:8000"]

  # Batch metrics written as .prom files by cron jobs on the manager
  # (per-rule gherkin costs, harvested peak-RSS numbers).
  - job_name: "textfile"
    static_configs:
      - targets: ["textfile_exporter:9100"]

  # Per-container memory/CPU. Closes the gap that made the clamd incident
  # possible: long-lived daemons inside containers were invisible.
  - job_name: "cadvisor"
    dns_sd_configs:
      - names: ["tasks.cadvisor"]
        type: A
        port: 8080
