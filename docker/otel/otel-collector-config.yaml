# see https://opentelemetry.io/docs/collector/configuration/

# receivers configure how telemetry data gets into the collector
receivers:
  otlp:
    protocols:
      # Bind to 0.0.0.0 explicitly. Since collector version 0.104 the default is
      # localhost-only, which makes the receiver unreachable from other containers
      # on the overlay network.
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

# processors specify what happens with the received telemetry data
processors:
  batch:
    send_batch_size: 1000
    timeout: 10s

# exporters configure how to send processed data to backend(s)
exporters:
  # azuremonitorexporter:
  #   endpoint: azure_monitor_otlp:4317 # TODO
  # Pull-based exporter: Prometheus scrapes these metrics from the collector on :8889.
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:

# optional components that expand the capabilities of the collector
extensions:
  health_check:
  pprof:
  zpages:

# pipelines glue the receivers, processors, and exporters together
service:
  extensions: [health_check, pprof, zpages]
  telemetry:
    metrics:
      # Expose the collector's own metrics on :8888 so Prometheus can scrape them
      # (the default binds to localhost only).
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    # The prometheus exporter handles metrics only. Traces and logs therefore go to
    # the debug exporter, which writes them to the collector's own log. Every
    # pipeline needs at least one exporter or the collector refuses to start.
    # todo gh: Replace debug with a real trace backend once chosen.
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
